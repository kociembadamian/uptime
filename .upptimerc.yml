  introMessage: |
    Dane mogą pojawić się z kilkuminutowym opóźnieniem, a chwilowe przerwy w dostępie zwykle wynikają z awarii po stronie naszych dostawców infrastruktury — [OVH](https://www.status-ovhcloud.com) lub [Cloudflare](https://www.cloudflarestatus.com) — a nie z samych aplikacji.

    Data can lag a few minutes behind, and any downtime you see here often comes from our infrastructure providers — [OVH](https://www.status-ovhcloud.com) or [Cloudflare](https://www.cloudflarestatus.com) — rather than the apps themselves.
